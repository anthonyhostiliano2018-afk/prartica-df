e:"Según esa definición, el Derecho es el conjunto de normas que imponen deberes y confieren facultades, establecen las bases de la convivencia social y buscan dotar a todos de los mínimos de seguridad, certeza, igualdad, libertad y justicia."},
{id:"q1m04",x:1,u:1,t:T.a1,q:"Según la sesión 1, la seguridad como fin del Derecho es:",
o:["La garantía de protección y reparación frente a ataques a la persona y sus bienes","La obligación de cada persona de contratar un seguro privado de vida y de salud","El control policial permanente de todas las actividades de la población","El principio moral de dar a cada uno lo que le corresponde"],k:0,
e:"La seguridad es la garantía de que la persona, sus bienes y sus derechos no serán objeto de ataques violentos o que, si llegan a producirse, la sociedad le asegurará protección y reparación. Dar a cada uno lo que le corresponde es la justicia."},
{id:"q1m05",x:1,u:1,t:T.b1,q:"Según la sesión 1, ¿qué es la ley?",
o:["Una norma dictada por la autoridad competente que manda o prohíbe algo","Una costumbre que nace sola, sin intervención de ninguna autoridad","Un consejo moral que cada ciudadano puede seguir o ignorar","Un acuerdo privado que solo obliga a quienes lo firman"],k:0,
e:"La ley (del latín lex, legis) es una norma jurídica dictada por el legislador o autoridad competente, en la que se manda o prohíbe algo en consonancia con la justicia, y cuyo incumplimiento conlleva una sanción."},
{id:"q1m06",x:1,u:1,t:T.b1,q:"En la lámina «El incumplimiento de una norma genera una sanción», ¿cuál NO se mostró como ejemplo de sanción?",
o:["La clausura de establecimientos","Los embargos","Las multas","El asilo político"],k:3,
e:"La lámina mostró la clausura de establecimientos (la de un centro comercial por una municipalidad), las penas privativas de libertad (detención, cárcel), los embargos y las multas. El asilo político es una protección a perseguidos (art. 36), no una sanción."},
{id:"q1m07",x:1,u:1,t:T.c1,q:"Según la sesión 1, ¿cuál fue uno de los ejemplos de derecho natural de la antigüedad?",
o:["La protección que Zeus daba a los mensajeros en la cultura griega","La Constitución Política del Perú de 1993 y los incisos de su art. 2","El Código Penal peruano y sus cuatro clases de pena","Las ordenanzas municipales del distrito de La Victoria"],k:0,
e:"Entre los ejemplos de derecho natural se citaron los derechos humanos contemporáneos, los mandamientos religiosos y las leyes divinas de la antigüedad: Zeus protegía a los mensajeros, y matar al que traía malas noticias era una afrenta. Las otras alternativas son derecho positivo."},
{id:"q1m08",x:1,u:1,t:T.c1,q:"¿Qué afirmación sobre el derecho positivo es correcta, según la sesión 1?",
o:["Es el derecho escrito que dictan los órganos legislativos","Es un conjunto de reglas no escritas basadas en la naturaleza","Solo existe en las religiones antiguas y en sus leyes divinas","No obliga a nadie porque no tiene ninguna sanción prevista"],k:0,
e:"El derecho positivo es el derecho escrito: el que figura en las constituciones, códigos y ordenanzas, dictado por las autoridades competentes. Es lo que comúnmente llamamos «la ley» o «las leyes»."},
{id:"q1m09",x:1,u:1,t:T.d1,q:"Según la sesión 1, el derecho a la intimidad, presentado como ejemplo de derecho humano, es:",
o:["Un muro que prohíbe divulgar datos de la religión, la política o la vida íntima","El derecho a buscar, recibir y difundir informaciones e ideas de toda índole","El derecho a que nadie sea procesado sin respetar todos los procedimientos","El derecho a que nadie mancille el honor, la reputación ni la imagen"],k:0,
e:"La lámina definió la intimidad como un muro que prohíbe publicar o dar a conocer datos sobre la religión, la política o la vida íntima. Buscar y difundir informaciones es la libertad; no ser procesado sin respetar los procedimientos, el debido proceso; y no mancillar el honor, la dignidad."},
{id:"q1m10",x:1,u:1,t:T.e1,num:1,q:"El derecho a la nacionalidad, y a no ser privado de obtener o renovar el pasaporte, está en el art. 2:",
o:["Inciso 21","Inciso 11","Inciso 19","Inciso 2"],k:0,
e:"Inc. 21: nacionalidad y pasaporte. Inc. 11: residencia y libre tránsito. Inc. 19: identidad étnica y cultural. Inc. 2: igualdad ante la ley."},
{id:"q1m11",x:1,u:1,t:T.e1,q:"Según el art. 2, inc. 3, el ejercicio público de todas las confesiones religiosas es libre, siempre que:",
o:["No ofenda la moral ni altere el orden público","Sea autorizado previamente por el Estado","Pertenezca a la religión católica","Se realice solo dentro de los templos"],k:0,
e:"El inc. 3 reconoce la libertad de conciencia y de religión, en forma individual o asociada: no hay persecución por ideas o creencias ni delito de opinión, y el ejercicio público de todas las confesiones es libre, siempre que no ofenda la moral ni altere el orden público."},
{id:"q1m12",x:1,u:1,t:T.e1,q:"Según el art. 2, inc. 11, ¿por qué razones se puede limitar el derecho a transitar por el territorio, salir del país y entrar en él?",
o:["Por sanidad, por mandato judicial o por la ley de extranjería","Por decisión de cualquier alcalde, prefecto o gobernador regional","Por no haber votado en las últimas elecciones municipales","Por tener deudas pendientes con un banco o con una financiera"],k:0,
e:"El inc. 11 reconoce el derecho a elegir el lugar de residencia, a transitar por el territorio y a salir y entrar en él, salvo limitaciones por razones de sanidad, por mandato judicial o por aplicación de la ley de extranjería."},
{id:"q1m13",x:1,u:1,t:T.e1,q:"Según el art. 2, inc. 13, las asociaciones y fundaciones sin fines de lucro:",
o:["No pueden ser disueltas por resolución administrativa","Necesitan autorización previa del Ministerio del Interior","Solo pueden crearse con un permiso del Congreso","Pueden ser disueltas por cualquier municipalidad"],k:0,
e:"El inc. 13 reconoce el derecho a asociarse y a constituir fundaciones y otras organizaciones sin fines de lucro, sin autorización previa y con arreglo a ley; además, no pueden ser disueltas por resolución administrativa."},
{id:"q1m14",x:1,u:1,t:T.e1,q:"Un abogado se niega a revelar lo que su cliente le confió. ¿Qué derecho del art. 2 lo ampara?",
o:["El secreto profesional (inc. 18)","La legítima defensa (inc. 23)","La libertad de contratar (inc. 14)","El derecho de petición (inc. 20)"],k:0,
e:"El inc. 18 reconoce el derecho a mantener reserva sobre las propias convicciones políticas, filosóficas, religiosas o de cualquier otra índole, así como a guardar el secreto profesional."},
{id:"q1m15",x:1,u:1,t:T.e1,num:1,q:"Una persona es agredida en la calle y se defiende para proteger su vida. ¿Qué inciso del art. 2 reconoce ese derecho?",
o:["Inciso 23: la legítima defensa","Inciso 22: la paz y la tranquilidad","Inciso 1: la identidad","Inciso 16: la propiedad y la herencia"],k:0,
e:"El inc. 23 reconoce el derecho a la legítima defensa. En la sesión 1 también se mencionó entre los derechos que ninguna ley puede contravenir."},
{id:"q1m16",x:1,u:1,t:T.e1,q:"Según el art. 2, inc. 24, literal h, si una persona detenida fue golpeada, ¿quién puede pedir de inmediato su examen médico?",
o:["Cualquier persona","Solo su abogado","Solo el fiscal","Solo un juez"],k:0,
e:"El literal h dispone que cualquiera puede pedir de inmediato el examen médico de la persona agraviada o de aquella imposibilitada de recurrir por sí misma a la autoridad. Además, las declaraciones obtenidas por la violencia carecen de valor."},
{id:"q1m17",x:1,u:1,t:T.a1,q:"Según la lámina «Cuatro formas de definir el Derecho», el Derecho como ciencia se enfoca en:",
o:["El estudio sistemático y riguroso de las leyes y normas jurídicas","La facultad que tiene una persona para hacer, no hacer o exigir algo","El conjunto de leyes, decretos y reglamentos vigentes en el país","La felicidad social que produce cumplir la ley"],k:0,
e:"Como ciencia, el Derecho se enfoca en el estudio sistemático y riguroso de las leyes y normas jurídicas para comprender su origen, su evolución y su aplicación en la vida cotidiana. La facultad de exigir es el Derecho como facultad; las leyes y decretos, el Derecho como conjunto de normas."},
{id:"q1m18",x:1,u:1,t:T.a1,q:"Según la sesión 1, el «hombre», a diferencia de la «persona», es:",
o:["La especie humana en general, el único ser con consciencia y capacidad","Un concepto jurídico que la ley crea para atribuir derechos y obligaciones","Una entidad sin existencia física individual, como una empresa","Solo el ciudadano mayor de dieciocho años inscrito en el registro"],k:0,
e:"El hombre (varón y mujer) es la especie humana en general, el único con consciencia y capacidad; la persona es un concepto jurídico. La entidad sin existencia física individual sujeta a derechos y obligaciones es la persona jurídica."},
{id:"q1m19",x:1,u:1,t:T.e1,q:"Según el art. 2, inc. 20, cuando alguien formula una petición por escrito, la autoridad está obligada a:",
o:["Responderle por escrito dentro del plazo legal","Responderle solo si la petición es colectiva y la firman varios","Archivarla si el ciudadano no paga una tasa especial","Responder de forma verbal cuando lo considere conveniente"],k:0,
e:"El inc. 20 reconoce el derecho a formular peticiones, individual o colectivamente, por escrito ante la autoridad competente, que está obligada a dar al interesado una respuesta también por escrito dentro del plazo legal, bajo responsabilidad."},
{id:"q1m20",x:1,u:1,t:T.e1,num:1,q:"La libertad de creación intelectual, artística, técnica y científica, y la propiedad sobre esas creaciones, están en el art. 2:",
o:["Inciso 8","Inciso 16","Inciso 4","Inciso 14"],k:0,
e:"Inc. 8: libertad de creación intelectual, artística, técnica y científica, y propiedad sobre esas creaciones. Inc. 16: propiedad y herencia. Inc. 4: libertades de información, opinión y expresión. Inc. 14: contratar con fines lícitos."},
{id:"q2m01",x:2,u:2,t:T.a2,q:"¿Qué institución municipal se mostró en clase como defensora de los niños, niñas y adolescentes al estudiar el art. 4?",
o:["DEMUNA","CONADIS","ONPE","SUNAFIL"],k:0,
e:"La DEMUNA es la Defensoría Municipal del Niño, Niña y Adolescente. El art. 4 obliga a la comunidad y al Estado a proteger especialmente al niño, al adolescente, a la madre y al anciano en situación de abandono."},
{id:"q2m02",x:2,u:2,t:T.a2,q:"Según la sesión 2, ¿cuándo se tramita un divorcio por causal ante el Poder Judicial?",
o:["Cuando un cónyuge no está de acuerdo o hay conflictos por bienes e hijos","Cuando ambos cónyuges están de acuerdo y no tienen hijos menores","Cuando la pareja convivió menos de dos años antes de casarse por civil","Siempre que uno de los cónyuges lo solicite en una notaría"],k:0,
e:"El divorcio por mutuo acuerdo (Ley 29227) se tramita en municipalidades autorizadas o notarías. El divorcio por causal se tramita ante el Poder Judicial cuando uno de los cónyuges no está de acuerdo o existen conflictos sobre bienes e hijos."},
{id:"q2m03",x:2,u:2,t:T.a2,q:"Según el art. 6, el Estado asegura programas de educación e información y el acceso a medios (de planificación familiar) que:",
o:["No afecten la vida o la salud","Sean gratuitos para todas las familias","Hayan sido aprobados por la Iglesia","Reduzcan obligatoriamente la natalidad"],k:0,
e:"El art. 6 reconoce el derecho de las familias y de las personas a decidir, y dispone que el Estado asegura los programas de educación y la información adecuados y el acceso a los medios, siempre que no afecten la vida o la salud."},
{id:"q2m04",x:2,u:2,t:T.b2,q:"Según el art. 7, además del derecho a la protección de la salud, todos tienen:",
o:["El deber de contribuir a la promoción y defensa de la salud","El derecho a medicinas gratuitas en cualquier farmacia","La obligación de afiliarse a una AFP privada al cumplir 18 años","El derecho a elegir libremente a su médico en EsSalud"],k:0,
e:"El art. 7 reconoce el derecho a la protección de la salud propia, del medio familiar y de la comunidad, así como el deber de contribuir a su promoción y defensa."},
{id:"q2m05",x:2,u:2,t:T.b2,num:1,q:"El Estado combate y sanciona el tráfico ilícito de drogas y regula el uso de los tóxicos sociales según el:",
o:["Artículo 8","Artículo 7","Artículo 9","Artículo 12"],k:0,
e:"Art. 7: salud y protección de la persona con discapacidad. Art. 8: tráfico ilícito de drogas y tóxicos sociales. Art. 9: política nacional de salud. Art. 12: intangibilidad de los fondos de la seguridad social."},
{id:"q2m06",x:2,u:2,t:T.b2,q:"Al estudiar el art. 11 se mostraron logotipos de entidades de pensiones. ¿Cuál de ellas es la entidad del Estado?",
o:["ONP","Profuturo","Integra","Prima"],k:0,
e:"La ONP (Oficina de Normalización Previsional) es la entidad del Gobierno Nacional que administra los regímenes de pensiones a cargo del Estado. Profuturo, Integra, Prima y Habitat son AFP privadas: el art. 11 permite el acceso a pensiones a través de entidades públicas, privadas o mixtas."},
{id:"q2m07",x:2,u:2,t:T.c2,q:"Según el art. 13, los padres de familia tienen el deber de educar a sus hijos y el derecho de:",
o:["Escoger el centro educativo y participar en el proceso educativo","Elegir las calificaciones que sus hijos reciben al final del año","Decidir el sueldo de los profesores del colegio de sus hijos","Cerrar el colegio cuando no estén de acuerdo con su director"],k:0,
e:"El art. 13 establece que la educación tiene como finalidad el desarrollo integral de la persona, que el Estado garantiza la libertad de enseñanza y que los padres tienen el deber de educar a sus hijos y el derecho de escoger los centros de educación y de participar en el proceso educativo."},
{id:"q2m08",x:2,u:2,t:T.c2,q:"Según el art. 14, ¿quiénes deben colaborar con el Estado en la educación y en la formación moral y cultural?",
o:["Los medios de comunicación social","Las Fuerzas Armadas","Los partidos políticos","Los colegios profesionales"],k:0,
e:"El art. 14 dispone que los medios de comunicación social deben colaborar con el Estado en la educación y en la formación moral y cultural. También establece que es deber del Estado promover el desarrollo científico y tecnológico del país."},
{id:"q2m09",x:2,u:2,t:T.c2,q:"Según el art. 17, ¿qué tipo de educación fomenta el Estado según las características de cada zona?",
o:["Bilingüe e intercultural","Exclusivamente en castellano","Solo técnica y productiva","Militar y religiosa"],k:0,
e:"El art. 17 establece que el Estado fomenta la educación bilingüe e intercultural según las características de cada zona, preserva las diversas manifestaciones culturales y lingüísticas del país y promueve la integración nacional."},
{id:"q2m10",x:2,u:2,t:T.c2,q:"Según el art. 18, ¿qué garantiza el Estado en la universidad, junto con el rechazo a la intolerancia?",
o:["La libertad de cátedra","La gratuidad total para todos los alumnos","El ingreso sin examen de admisión","La elección de rectores por el Congreso"],k:0,
e:"El art. 18 dispone que el Estado garantiza la libertad de cátedra y rechaza la intolerancia. La universidad es la comunidad de profesores, alumnos y graduados."},
{id:"q2m11",x:2,u:2,t:T.c2,q:"Según el art. 19, las donaciones y becas con fines educativos:",
o:["Gozan de exoneración y beneficios tributarios según la ley","Están prohibidas en las universidades públicas del país","Deben pagar el doble del impuesto a la renta normal","Solo pueden otorgarlas los bancos y las empresas mineras"],k:0,
e:"El art. 19 establece que las donaciones y becas con fines educativos gozan de exoneración y beneficios tributarios en la forma y dentro de los límites que fije la ley; además, los centros educativos gozan de inafectación de impuestos en lo propio de su finalidad educativa."},
{id:"q2m12",x:2,u:2,t:T.d2,q:"En la diapositiva sobre el art. 20 (colegios profesionales), ¿qué fecha se mostró como el Día del Licenciado en Administración?",
o:["14 de febrero","1 de mayo","28 de julio","8 de octubre"],k:0,
e:"La diapositiva mostró que el 14 de febrero es el Día del Licenciado en Administración, junto con la Ley 31060, del ejercicio profesional del licenciado en administración."},
{id:"q2m13",x:2,u:2,t:T.e2,q:"Según el art. 23, el Estado promueve condiciones para el progreso social y económico, en especial mediante políticas de:",
o:["Fomento del empleo productivo y de educación para el trabajo","Congelamiento de sueldos y reducción de las vacaciones anuales","Prohibición de la inversión privada en todos los sectores","Eliminación de los sindicatos y de la negociación colectiva"],k:0,
e:"El art. 23 establece que el trabajo es objeto de atención prioritaria del Estado, que promueve el progreso social y económico mediante políticas de fomento del empleo productivo y de educación para el trabajo."},
{id:"q2m14",x:2,u:2,t:T.e2,q:"Según la diapositiva del art. 24, ¿cuál era el sueldo mínimo a partir del 1 de enero de 2025?",
o:["S/ 1 130","S/ 1 025","S/ 930","S/ 1 500"],k:0,
e:"La diapositiva indicó que el sueldo mínimo pasó a S/ 1 130 desde el 1 de enero de 2025. Según el art. 24, las remuneraciones mínimas las regula el Estado con participación de las organizaciones de trabajadores y empleadores."},
{id:"q2m15",x:2,u:2,t:T.e2,q:"Según el art. 28, el Estado regula el derecho de huelga para que se ejerza:",
o:["En armonía con el interés social, con excepciones y límites","Sin ninguna limitación, en cualquier momento y en cualquier sector","Solo con autorización previa y escrita del empleador","Únicamente en el sector público y nunca en empresas privadas"],k:0,
e:"El art. 28 reconoce los derechos de sindicación, negociación colectiva y huelga, y dispone que el Estado regula la huelga para que se ejerza en armonía con el interés social, señalando sus excepciones y limitaciones."},
{id:"q2m16",x:2,u:2,t:T.e2,num:1,q:"¿Qué artículo establece que ninguna relación laboral puede limitar el ejercicio de los derechos constitucionales ni rebajar la dignidad del trabajador?",
o:["Artículo 23","Artículo 22","Artículo 26","Artículo 29"],k:0,
e:"Art. 22: el trabajo es un deber y un derecho. Art. 23: atención prioritaria al trabajo, protección de la madre, el menor y el impedido, y prohibición de rebajar la dignidad del trabajador. Art. 26: principios laborales. Art. 29: utilidades."},
{id:"q2m17",x:2,u:2,t:T.a2,q:"Según el art. 6, ¿qué es deber y derecho de los padres respecto de sus hijos?",
o:["Alimentar, educar y dar seguridad a sus hijos","Elegir la profesión que sus hijos estudiarán","Administrar los sueldos de sus hijos mayores de edad","Decidir con quién se casarán sus hijos"],k:0,
e:"El art. 6 dispone que es deber y derecho de los padres alimentar, educar y dar seguridad a sus hijos, y que los hijos tienen el deber de respetar y asistir a sus padres. Además, todos los hijos tienen iguales derechos y deberes."},
{id:"q2m18",x:2,u:2,t:T.c2,q:"Según el art. 15, el profesorado en la enseñanza oficial es:",
o:["Carrera pública","Un servicio voluntario no remunerado","Una actividad reservada a los colegios profesionales","Un cargo de confianza del alcalde"],k:0,
e:"El art. 15 establece que el profesorado en la enseñanza oficial es carrera pública, que la ley fija los requisitos para ser director o profesor, y que el Estado y la sociedad procuran su evaluación, capacitación, profesionalización y promoción permanentes."},
{id:"q2m19",x:2,u:2,t:T.e2,num:1,q:"El derecho a una remuneración equitativa y suficiente, y la prioridad de su pago sobre cualquier otra obligación del empleador, están en el:",
o:["Artículo 24","Artículo 23","Artículo 25","Artículo 29"],k:0,
e:"Art. 23: atención prioritaria al trabajo. Art. 24: remuneración equitativa y suficiente, prioridad de pago y remuneración mínima. Art. 25: jornada y descanso. Art. 29: participación en las utilidades."},
{id:"q2m20",x:2,u:2,t:T.b2,q:"Según el art. 9, el Poder Ejecutivo debe diseñar y conducir la política nacional de salud en forma:",
o:["Plural y descentralizadora","Centralizada desde Lima","Privada, a cargo de clínicas","Militar, a cargo de las Fuerzas Armadas"],k:0,
e:"El art. 9 dispone que el Estado determina la política nacional de salud y que el Poder Ejecutivo la norma y supervisa, y es responsable de diseñarla y conducirla en forma plural y descentralizadora para facilitar a todos el acceso equitativo a los servicios de salud."},
{id:"q3m01",x:3,u:3,t:T.a3,q:"Según la sesión 3, ser ciudadano implica formar parte de una comunidad social con derechos civiles y obligaciones cívicas, como:",
o:["Tener una identidad nacional y participar en la vida política","Pagar impuestos al país donde se reside, aunque sea extranjero","Pertenecer obligatoriamente a un partido político inscrito","Vivir en la capital del país o en una capital de región"],k:0,
e:"La ciudadanía se refiere al conjunto de derechos y deberes de un individuo en su relación con la sociedad; ser ciudadano implica formar parte de una comunidad con derechos civiles y obligaciones cívicas, como tener una identidad nacional y participar en la vida política."},
{id:"q3m02",x:3,u:3,t:T.a3,q:"Un bebé de un mes hereda una casa de su abuelo. Según la sesión 3, ¿qué capacidad le permite ser titular de ese bien?",
o:["La capacidad de goce","La capacidad de ejercicio","La ciudadanía","La mayoría de edad"],k:0,
e:"La capacidad de goce se adquiere con el nacimiento y es la aptitud para ser titular de derechos y obligaciones. El bebé puede ser dueño de la casa, aunque no pueda ejercer por sí mismo esos derechos: eso requiere capacidad de ejercicio, que se adquiere con la mayoría de edad."},
{id:"q3m03",x:3,u:3,t:T.b3,q:"Según el art. 31, ¿quiénes tienen derecho al voto?",
o:["Los ciudadanos en goce de su capacidad civil e inscritos en el registro","Todos los peruanos desde los dieciséis años, aunque no estén inscritos","Solo quienes tienen un título profesional o técnico registrado","Los extranjeros que tienen más de un año de residencia en el Perú"],k:0,
e:"Tienen derecho al voto los ciudadanos en goce de su capacidad civil, y para ejercerlo se requiere estar inscrito en el registro correspondiente. El voto es personal, igual, libre, secreto y obligatorio hasta los 70 años."},
{id:"q3m04",x:3,u:3,t:T.b3,q:"Según el art. 31, ¿qué deben garantizar los mecanismos que establece la ley durante los procesos electorales y de participación ciudadana?",
o:["La neutralidad estatal","El voto público","La reelección de las autoridades","La censura de los medios"],k:0,
e:"El art. 31 encarga a la ley establecer los mecanismos para garantizar la neutralidad estatal durante los procesos electorales y de participación ciudadana: el Estado no puede favorecer a ningún candidato."},
{id:"q3m05",x:3,u:3,t:T.b3,q:"Según el art. 31, es derecho y deber de los vecinos:",
o:["Participar en el gobierno municipal de su jurisdicción","Elegir al Presidente del Consejo de Ministros","Aprobar cada año el presupuesto nacional de la República","Nombrar a los jueces de su distrito"],k:0,
e:"El art. 31 dispone que es derecho y deber de los vecinos participar en el gobierno municipal de su jurisdicción, y que la ley norma y promueve los mecanismos directos e indirectos de su participación, como las juntas vecinales."},
{id:"q3m06",x:3,u:3,t:T.b3,q:"Según el art. 32, ¿cuántas materias pueden someterse a referéndum?",
o:["Cuatro","Tres","Dos","Seis"],k:0,
e:"Son cuatro: la reforma total o parcial de la Constitución, la aprobación de normas con rango de ley, las ordenanzas municipales y las materias relativas al proceso de descentralización. Hay tres exclusiones: la supresión o disminución de derechos fundamentales, las normas tributarias y presupuestales, y los tratados internacionales en vigor."},
{id:"q3m07",x:3,u:3,t:T.b3,q:"¿Cuál de estas propuestas NO formó parte del Referéndum Nacional 2018?",
o:["La pena de muerte para delitos graves","La Junta Nacional de Justicia","El financiamiento de las organizaciones políticas","La prohibición de la reelección inmediata de parlamentarios"],k:0,
e:"En 2018 se consultaron cuatro reformas: la Junta Nacional de Justicia (antes Consejo Nacional de la Magistratura), el financiamiento de las organizaciones políticas, la no reelección inmediata de parlamentarios y la bicameralidad. La pena de muerte no se consultó."},
{id:"q3m08",x:3,u:3,t:T.c3,q:"¿Qué causa de suspensión de la ciudadanía implica la reclusión del condenado en un centro penitenciario?",
o:["La sentencia con pena privativa de la libertad","La resolución judicial de interdicción","La sentencia con inhabilitación de los derechos políticos","La falta de inscripción electoral"],k:0,
e:"La pena privativa de la libertad consiste en restringir el movimiento del condenado y recluirlo en un establecimiento como un centro penitenciario. La interdicción es la declaración judicial de incapacidad, y la inhabilitación suspende el derecho a elegir, ser elegido y ejercer funciones públicas."},
{id:"q3m09",x:3,u:3,t:T.c3,q:"En la diapositiva del art. 33, ¿qué caso se mostró como ejemplo de inhabilitación de los derechos políticos?",
o:["Martín Vizcarra, inhabilitado por diez años por el cierre del Congreso","Alejandro Toledo, extraditado desde Estados Unidos al Perú","La familia de Pedro Castillo, que recibió asilo de México","Nadine Heredia, que solicitó asilo en la embajada de Brasil"],k:0,
e:"La diapositiva mostró el titular sobre la inhabilitación por diez años de Martín Vizcarra por el cierre del Congreso en 2019. Toledo fue el ejemplo de extradición (art. 37), y Castillo y Heredia, los de asilo (art. 36)."},
{id:"q3m10",x:3,u:3,t:T.c3,q:"Un general del Ejército en actividad quiere postular al Congreso. Según el art. 34:",
o:["No puede postular mientras no haya pasado a la situación de retiro","Puede postular siempre que renuncie a su derecho al voto","Puede postular, pero solo en elecciones municipales y regionales","Puede postular si su partido está inscrito en el registro"],k:0,
e:"Los miembros de las Fuerzas Armadas y de la Policía Nacional tienen derecho al voto y a la participación ciudadana, pero no pueden postular a cargos de elección popular, participar en actividades partidarias o manifestaciones ni hacer proselitismo mientras no hayan pasado a la situación de retiro."},
{id:"q3m11",x:3,u:3,t:T.c3,q:"Una persona fue condenada en primera instancia como cómplice de un delito doloso y apeló la sentencia. Según el art. 34-A:",
o:["Está impedida de postular, aunque la sentencia no esté firme","Puede postular, porque la sentencia todavía no está firme","Puede postular, porque solo fue cómplice y no autora del delito","Solo estaría impedida si el delito hubiera sido culposo"],k:0,
e:"El art. 34-A (Ley 31042) impide postular a quienes tengan una sentencia condenatoria emitida en primera instancia, como autores o cómplices, por delito doloso. No exige que la sentencia esté firme, y alcanza tanto al autor como al cómplice."},
{id:"q3m12",x:3,u:3,t:T.d3,q:"Según el art. 36, ¿quién califica la condición de asilado político que el Perú acepta?",
o:["El gobierno asilante","La Corte Suprema","El país que persigue al asilado","El Jurado Nacional de Elecciones"],k:0,
e:"El art. 36 dispone que el Estado reconoce el asilo político y acepta la calificación del asilado que otorga el gobierno asilante; en caso de expulsión, no se entrega al asilado al país cuyo gobierno lo persigue."},
{id:"q3m13",x:3,u:3,t:T.d3,q:"Según el art. 37, la extradición se concede en cumplimiento de la ley y de los tratados, y según el principio de:",
o:["Reciprocidad","Territorialidad","Irretroactividad","Doble instancia"],k:0,
e:"La extradición solo la concede el Poder Ejecutivo previo informe de la Corte Suprema, en cumplimiento de la ley y de los tratados, y según el principio de reciprocidad, es decir, de trato recíproco entre Estados."},
{id:"q3m14",x:3,u:3,t:T.d3,q:"Una persona perseguida en otro país por actos de terrorismo pide no ser extraditada alegando que es una perseguida política. Según el art. 37:",
o:["Puede ser extraditada, porque el terrorismo no se considera delito político","No puede ser extraditada, porque toda persecución es política","No puede ser extraditada si tiene familia en el Perú","Solo el Congreso puede decidir si se la extradita"],k:0,
e:"Quedan excluidos de la extradición los perseguidos por delitos políticos o hechos conexos, pero el art. 37 aclara que no se consideran tales el genocidio, el magnicidio ni el terrorismo. La extradición la concede el Poder Ejecutivo previo informe de la Corte Suprema."},
{id:"q3m15",x:3,u:3,t:T.e3,q:"¿Qué símbolos patrios se mostraron al estudiar el deber de honrar al Perú (art. 38)?",
o:["El escudo, el himno y la bandera","El escudo, la Constitución y la escarapela","La bandera, el sol y el cóndor","El himno, la marinera y la vicuña"],k:0,
e:"Al explicar el art. 38 se mostraron el escudo, el himno y la bandera. Honrar al Perú significa demostrar lealtad, compromiso y devoción hacia la nación, con respeto por su historia y sus símbolos patrios."},
{id:"q3m16",x:3,u:3,t:T.e3,q:"Como tarea sobre el deber de honrar al Perú, se trabajaron canciones de dos intérpretes peruanos. ¿Quiénes fueron?",
o:["Arturo Cavero y Luis Abanto Morales","Chabuca Granda y Lucha Reyes","Susana Baca y Eva Ayllón","Gian Marco y Pedro Suárez-Vértiz"],k:0,
e:"La tarea incluyó «Y se llama Perú», interpretada por Arturo Cavero (1940-2009), y «Cholo soy», interpretada por Luis Abanto Morales (1923-2017), dos canciones sobre la identidad y el amor por el Perú."},
{id:"q3m17",x:3,u:3,t:T.a3,num:1,q:"¿Qué artículo del Código Civil, citado en la sesión 3, dispone que la capacidad de ejercicio solo puede ser restringida por ley?",
o:["Artículo 3","Artículo 234","Artículo 326","Artículo 28"],k:0,
e:"El art. 3 del Código Civil establece que toda persona tiene capacidad jurídica para el goce y ejercicio de sus derechos, y que la capacidad de ejercicio solo puede ser restringida por ley. El 234 trata del matrimonio y el 326 de la unión de hecho; el art. 28 que se vio es del Código Penal."},
{id:"q3m18",x:3,u:3,t:T.b3,q:"Según el art. 31, ¿cuál de estos derechos tienen los ciudadanos?",
o:["Elegir y ser elegidos libremente, según la ley orgánica","Votar solo si son propietarios de un inmueble inscrito","Postular a cargos públicos sin inscribirse en ningún registro","Nombrar directamente a los jueces de la Corte Suprema"],k:0,
e:"El art. 31 reconoce el derecho de los ciudadanos a ser elegidos y a elegir libremente a sus representantes, de acuerdo con las condiciones y procedimientos determinados por ley orgánica, además de los mecanismos de participación directa."},
{id:"q3m19",x:3,u:3,t:T.d3,q:"Según la diapositiva del art. 35, ¿en qué registro se inscriben los partidos políticos?",
o:["El Registro de Organizaciones Políticas (ROP)","El Registro Único de Contribuyentes (RUC)","El Registro de Personas Naturales del RENIEC","El Registro de la Propiedad Inmueble"],k:0,
e:"La diapositiva mostró a los partidos políticos inscritos en el ROP (Registro de Organizaciones Políticas). Según el art. 35, esa inscripción les concede personalidad jurídica."},
{id:"q3m20",x:3,u:3,t:T.d3,q:"Según la diapositiva sobre el asilo político, ¿qué ocurrió en el caso de la familia de Pedro Castillo?",
o:["Recibió asilo de México, y el Perú expulsó al embajador mexicano","Fue extraditada a Estados Unidos por pedido de la Corte Suprema","Solicitó asilo en la embajada de Brasil, como Nadine Heredia","Fue declarada interdicta por un juez y perdió la ciudadanía"],k:0,
e:"La diapositiva mostró una noticia: México concedió asilo a la familia de Pedro Castillo y el gobierno peruano expulsó al embajador mexicano. Nadine Heredia fue el ejemplo de solicitud de asilo a Brasil, y Alejandro Toledo, el de extradición desde Estados Unidos."},
{id:"q4m01",x:4,u:1,t:T.e1,num:1,q:"¿Qué inciso del art. 2 contiene la presunción de inocencia, el principio de legalidad penal y la prohibición de la prisión por deudas?",
o:["Inciso 24","Inciso 23","Inciso 20","Inciso 1"],k:0,
e:"El inc. 24 (libertad y seguridad personales) contiene, entre otros, la prohibición de la prisión por deudas (literal c), la legalidad penal (literal d) y la presunción de inocencia (literal e)."},
{id:"q4m02",x:4,u:1,t:T.b1,num:1,q:"¿Qué artículo del Código Penal establece las clases de pena (privativa de libertad, restrictivas de libertad, limitativas de derechos y multa)?",
o:["Artículo 28","Artículo 326","Artículo 234","Artículo 3"],k:0,
e:"El art. 28 del Código Penal (D. Leg. 635) fija las clases de pena. Los arts. 3, 234 y 326 son del Código Civil: capacidad, matrimonio y unión de hecho."},
{id:"q4m03",x:4,u:1,t:T.d1,q:"Según los conceptos básicos de la sesión 1, ¿qué alcance tienen los derechos humanos?",
o:["Protegen la dignidad de todos los seres humanos en el mundo","Solo rigen dentro del territorio peruano y para peruanos","Solo protegen a quienes tienen DNI y están inscritos","Solo rigen en las relaciones entre particulares, no frente al Estado"],k:0,
e:"Los derechos humanos son normas que reconocen y protegen la dignidad de todos los seres humanos en el mundo, y rigen tanto las relaciones entre las personas como sus relaciones con el Estado y las obligaciones del Estado hacia ellas. Los derechos fundamentales son los que cada país incluye en su Constitución."},
{id:"q4m04",x:4,u:1,t:T.e1,q:"La frase «La ley es dura, pero es la ley», que aparece al cerrar la sesión 1, expresa que:",
o:["La ley debe cumplirse aunque resulte exigente","Solo deben cumplirse las leyes que nos gustan","Las leyes duras no tienen validez","Los jueces pueden ignorar las leyes severas"],k:0,
e:"La frase (en latín, dura lex, sed lex) recuerda que la ley obliga aunque su cumplimiento resulte difícil. En la misma lámina se recordó que la Constitución es la máxima ley, la «ley de leyes»."},
{id:"q4m05",x:4,u:1,t:T.a1,q:"Según la sesión 1, ¿cuál de estas NO es una de las cuatro formas de definir el Derecho?",
o:["El Derecho como castigo divino","El Derecho como facultad","El Derecho como idea de justicia","El Derecho como ciencia"],k:0,
e:"Las cuatro formas vistas en clase son el Derecho como facultad, como conjunto de normas, como idea de justicia y como ciencia."},
{id:"q4m17",x:4,u:1,t:T.e1,num:1,q:"El derecho a la igualdad ante la ley y a no ser discriminado está en el art. 2:",
o:["Inciso 2","Inciso 1","Inciso 19","Inciso 24"],k:0,
e:"Inc. 1: vida, identidad e integridad. Inc. 2: igualdad ante la ley y no discriminación por origen, raza, sexo, idioma, religión, opinión, condición económica o de cualquier otra índole. Inc. 19: identidad étnica y cultural. Inc. 24: libertad y seguridad personales."},
{id:"q4m18",x:4,u:1,t:T.c1,q:"Según la sesión 1, ¿cuál de estos es un ejemplo de derecho natural?",
o:["Los mandamientos religiosos tenidos como leyes divinas","El Código Penal peruano (Decreto Legislativo 635)","La Ley General de Sociedades (Ley 26887)","Una ordenanza municipal del distrito de La Victoria"],k:0,
e:"Los mandamientos religiosos, que en alguna época se tuvieron por leyes divinas, fueron un ejemplo de derecho natural. El Código Penal, la Ley General de Sociedades y las ordenanzas son derecho positivo: derecho escrito dictado por una autoridad."},
{id:"q4m06",x:4,u:2,t:T.a2,num:1,q:"¿Qué artículo de la Constitución protege a la familia y promueve el matrimonio como institutos naturales y fundamentales de la sociedad?",
o:["Artículo 4","Artículo 5","Artículo 6","Artículo 2"],k:0,
e:"Art. 4: protección de la familia y promoción del matrimonio. Art. 5: concubinato. Art. 6: paternidad y maternidad responsables. Art. 2: derechos fundamentales de la persona."},
{id:"q4m07",x:4,u:2,t:T.c2,num:1,q:"La obligatoriedad de la educación inicial, primaria y secundaria, y su gratuidad en las instituciones del Estado, están en el:",
o:["Artículo 17","Artículo 13","Artículo 16","Artículo 18"],k:0,
e:"Art. 13: finalidad de la educación. Art. 16: sistema descentralizado y deber de que nadie quede excluido. Art. 17: educación obligatoria y gratuita. Art. 18: educación universitaria."},
{id:"q4m08",x:4,u:2,t:T.d2,num:1,q:"El patrimonio cultural de la Nación está regulado en el:",
o:["Artículo 21","Artículo 20","Artículo 19","Artículo 14"],k:0,
e:"Art. 19: beneficios tributarios de los centros educativos. Art. 20: colegios profesionales. Art. 21: patrimonio cultural de la Nación (en la diapositiva, con Machu Picchu de fondo). Art. 14: contenidos de la educación."},
{id:"q4m09",x:4,u:2,t:T.e2,num:1,q:"La protección contra el despido arbitrario está en el:",
o:["Artículo 27","Artículo 26","Artículo 25","Artículo 28"],k:0,
e:"Art. 25: jornada y descanso. Art. 26: principios de la relación laboral. Art. 27: adecuada protección contra el despido arbitrario. Art. 28: sindicación, negociación colectiva y huelga."},
{id:"q4m10",x:4,u:2,t:T.a2,num:1,q:"Según el art. 326 del Código Civil, ¿cuánto tiempo debe durar una unión de hecho para originar una sociedad de bienes?",
o:["Al menos dos años continuos","Al menos seis meses","Al menos cinco años","No se exige ningún plazo"],k:0,
e:"El art. 326 del Código Civil exige que la unión de hecho, entre un varón y una mujer libres de impedimento matrimonial, haya durado por lo menos dos años continuos para originar una sociedad de bienes sujeta al régimen de sociedad de gananciales."},
{id:"q4m11",x:4,u:2,t:T.e2,q:"Según el art. 25, los trabajadores tienen derecho a descanso semanal y anual remunerados, y su disfrute y compensación se regulan por:",
o:["Ley o por convenio","Decisión unilateral del empleador","Ordenanza municipal","Acuerdo del sindicato con el alcalde"],k:0,
e:"El art. 25 dispone que los trabajadores tienen derecho a descanso semanal y anual remunerados, y que su disfrute y su compensación se regulan por ley o por convenio."},
{id:"q4m19",x:4,u:2,t:T.d2,num:1,q:"¿Qué ley regula el ejercicio profesional del licenciado en administración?",
o:["Ley 31060","Ley 29227","Ley 26887","Ley 32330"],k:0,
e:"La Ley 31060 es la Ley de ejercicio profesional del licenciado en administración (vista con el art. 20, colegios profesionales). La 29227 regula el divorcio rápido, la 26887 es la Ley General de Sociedades y la 32330 trata de la imputabilidad de los adolescentes de 16 y 17 años."},
{id:"q4m12",x:4,u:3,t:T.c3,num:1,q:"¿En qué artículos están, respectivamente, el impedimento para postular a cargos de elección popular y el impedimento para ser designado en cargos de confianza, por condena en primera instancia por delito doloso?",
o:["34-A y 39-A","33 y 34","34 y 35","37 y 38"],k:0,
e:"La Ley 31042 incorporó el art. 34-A (impedimento para postular) y el art. 39-A (impedimento para ser designado en cargos de confianza). El art. 33 trata de la suspensión de la ciudadanía y el art. 34, de las Fuerzas Armadas y la Policía."},
{id:"q4m13",x:4,u:3,t:T.b3,num:1,q:"El referéndum, y las materias que pueden o no someterse a él, están en el:",
o:["Artículo 32","Artículo 31","Artículo 30","Artículo 35"],k:0,
e:"Art. 30: ciudadanía. Art. 31: participación ciudadana y voto. Art. 32: referéndum. Art. 35: organizaciones políticas."},
{id:"q4m14",x:4,u:3,t:T.a3,num:1,q:"¿Qué ley vista en la sesión 3 incorporó a los adolescentes de 16 y 17 años como sujetos imputables por determinados delitos?",
o:["Ley 32330","Ley 31042","Ley 29227","Ley 31060"],k:0,
e:"La Ley 32330 modificó el Código Penal (D. Leg. 635) y el Código de Responsabilidad Penal de Adolescentes (D. Leg. 1348). La Ley 31042 incorporó los arts. 34-A y 39-A; la 29227 regula el divorcio por mutuo acuerdo; y la 31060, el ejercicio profesional del licenciado en administración."},
{id:"q4m15",x:4,u:3,t:T.d3,q:"¿Qué órgano emite un informe previo antes de que el Poder Ejecutivo conceda una extradición (art. 37)?",
o:["La Corte Suprema","El Tribunal Constitucional","El Congreso de la República","La Defensoría del Pueblo"],k:0,
e:"La extradición solo la concede el Poder Ejecutivo previo informe de la Corte Suprema, en cumplimiento de la ley y de los tratados, y según el principio de reciprocidad."},
{id:"q4m16",x:4,u:3,t:T.e3,num:1,q:"El deber de todos los peruanos de honrar al Perú, proteger los intereses nacionales y respetar, cumplir y defender la Constitución está en el:",
o:["Artículo 38","Artículo 1","Artículo 30","Artículo 36"],k:0,
e:"Art. 1: fin supremo de la sociedad y del Estado. Art. 30: ciudadanía. Art. 36: asilo político. Art. 38: deberes de los peruanos."},
{id:"q4m20",x:4,u:3,t:T.a3,num:1,q:"Según el art. 30, ¿a qué edad se adquiere la ciudadanía en el Perú?",
o:["A los 18 años","A los 16 años","A los 21 años","A los 17 años"],k:0,
e:"Son ciudadanos los peruanos mayores de dieciocho años, y para ejercer la ciudadanía se requiere la inscripción electoral. La Ley 32330, sobre adolescentes de 16 y 17 años, trata de la responsabilidad penal, no de la ciudadanía."}

<section class="sheet teoria-card"><div><h2>Teoría: números de leyes y artículos</h2><p>Repasa las leyes, decretos y artículos de las diapositivas antes del examen final.</p></div><div class="row"><button type="button" class="btn" data-act="teoria">Ver la teoría</button></div></section>

/* ===== Quiz y examen final ===== */

  if(!E||E.entregado)return;
  const f=E.ids.filter(id=>!respondida(E,id)).length,nom=nombreQ(EXS[E.n-1]);
  dialogo(`Entregar ${nom}`,f?`Te ${f===1?"falta 1 pregunta":`faltan ${f} preguntas`} por responder; valdrán 0. ¿Entregas de todos modos?`:"Ya no podrás cambiar tus respuestas. ¿Entregas?",f?"Entregar así":"Entregar",()=>entregar(false));
}
function entregar(auto){
  if(!E||E.entregado)return;
  clearInterval(timerId);timerId=null;
  const dl=$(".dlg-back");if(dl)dl.remove();
  const usado=E.lim?Math.min(LIM,LIM-quedan(E)):(E.t||0);
  E.entregado=true;
  const res=E.ids.map(id=>{const p=BYID.get(id),el=typeof E.resp[id]==="number"?E.resp[id]:null;return {id,elegida:el,ok:el===p.k};});
  const ok=res.filter(r=>r.ok).length,sin=res.filter(r=>r.elegida===null).length,total=ok*20/res.length;
  const ses={},maxS={};res.forEach(r=>{const u=BYID.get(r.id).u;maxS[u]=(maxS[u]||0)+1;ses[u]=(ses[u]||0)+(r.ok?1:0);});
  E.resultado={res,ok,sin,total,ses,maxS,auto:!!auto,usado};
  store.del(kD(E.n));
  const h=store.get(kH(E.n),[]);h.unshift({f:Date.now(),nota:redondear(total),ok,s:usado,lim:!!E.lim,inst:!!E.inst});store.set(kH(E.n),h.slice(0,10));
  renderResultado();irArriba();
}
function mensajeNota(n){
  if(n>=17)return "Excelente: dominas este contenido.";
  if(n>=14)return "Buen nivel. Revisa lo que fallaste para afinar detalles.";
  if(n>=11)return "Aprobado, pero con vacíos. Repasa los temas que fallaste.";
  return "Aún no llegas a 11. Repasa la teoría y los temas que fallaste, y vuelve a intentarlo.";
}
function renderResultado(){
  modo="resultado";
  const R=E.resultado,ex=EXS[E.n-1],nota=redondear(R.total),aprob=nota>=11,nom=nombreQ(ex);
  const fallos=R.res.filter(r=>!r.ok).length,sig=ex.fin?null:E.n+1;
  const revs=R.res.map((r,i)=>{const p=BYID.get(r.id),orden=E.orden[r.id],L=oi=>LETRAS[orden.indexOf(oi)];
    const tuya=r.elegida===null?"<em>Sin responder</em>":`${L(r.elegida)}. ${esc(p.o[r.elegida])}`;
    return `<article class="sheet rev ${r.ok?"is-ok":"is-bad"}" data-ok="${r.ok?1:0}"><p class="meta"><span class="utag">Sesión ${p.u}</span><span>${esc(p.t)}</span><span class="pts">${r.ok?"Correcta":r.elegida===null?"Sin responder":"Incorrecta"}</span></p><h3 class="q-text"><span class="qn">${i+1}.</span> ${esc(p.q)}</h3><p class="lin"><span class="lab">Tu respuesta</span><span>${tuya}</span></p>${r.ok?"":`<p class="lin"><span class="lab">Correcta</span><span>${L(p.k)}. ${esc(p.o[p.k])}</span></p>`}<p class="exp">${esc(p.e)}</p></article>`;}).join("");
  const tiempo=E.lim?`Usaste ${mmss(R.usado)} de 6:00.`:`Tiempo: ${mmss(R.usado)}, sin límite.`;
  view.innerHTML=`${R.auto?`<p class="sheet aviso-fin" role="status"><strong>Se acabó el tiempo.</strong> El ${nom} se entregó automáticamente; las preguntas sin responder valen 0.</p>`:""}<section class="sheet result"><div class="stamp${aprob?"":" rojo"}${sinMovimiento()?"":" anim"}" role="img" aria-label="${ex.fin?"Examen final":`Quiz ${E.n}`}: nota ${nota} de 20, ${aprob?"aprobado":"desaprobado"}"><span class="s-top" aria-hidden="true">${ex.fin?"Final":`Quiz ${E.n}`}</span><span class="s-num" aria-hidden="true">${nota}</span><span class="s-bot" aria-hidden="true">${aprob?"Aprobado":"Desaprobado"}</span></div>
<div class="result-txt"><h2>Tu nota: ${nota} de 20</h2><p>${mensajeNota(nota)}</p>
<dl class="breakdown tres"><div><dt>Correctas</dt><dd>${R.ok}</dd></div><div><dt>Incorrectas</dt><dd>${R.res.length-R.ok-R.sin}</dd></div><div><dt>Sin responder</dt><dd>${R.sin}</dd></div></dl>
${Object.keys(R.maxS).length>1?`<dl class="breakdown tres">${Object.keys(R.maxS).sort().map(u=>`<div><dt>Sesión ${u}</dt><dd>${R.ses[u]||0} de ${R.maxS[u]}</dd></div>`).join("")}</dl>`:""}
<p class="small">Cada respuesta correcta vale 1 punto. ${tiempo}</p></div></section>
<div class="row"><button type="button" class="btn primary" data-act="rendir" data-n="${E.n}">Rendir otra vez</button>${fallos?`<button type="button" class="btn" data-act="practicar-fallos">Repasar lo que fallé (${fallos})</button>`:""}${sig?`<button type="button" class="btn" data-act="rendir" data-n="${sig}">${sig===4?"Ir al examen final":`Ir al quiz ${sig}`}</button>`:""}<button type="button" class="btn ghost" data-act="inicio">Inicio</button></div>
<div class="rev-head"><h2>Revisión</h2><label class="toggle"><input type="checkbox" id="solo-err"> Mostrar solo lo que fallé</label></div>${revs}`;
}

/* ===== Teoría ===== */
function renderTeoria(){
  modo="teoria";
  const fila=(a,b,c)=>`<tr data-q="${norm(a+" "+b+" "+(c||""))}"><th scope="row">${esc(a)}</th><td>${esc(b)}</td>${c!==undefined?`<td class="ses">${esc(c)}</td>`:""}</tr>`;
  view.innerHTML=`<div class="ptop"><button type="button" class="btn ghost sm" data-act="inicio">Inicio</button><span class="pcount">Teoría: números de leyes y artículos</span></div>
<section class="sheet teoria"><p class="lead">Todas las leyes, decretos y artículos que aparecen en las diapositivas de las sesiones 1, 2 y 3. Escribe un número o una palabra para filtrar.</p>
<label class="sr" for="filtro">Filtrar la teoría</label><input id="filtro" type="search" placeholder="Ej.: 29227, unión de hecho, extradición" autocomplete="off">
<p class="small" id="sin-res" hidden>No hay coincidencias.</p>
<div class="grupo"><h2>Leyes, decretos y códigos citados</h2><div class="tabla"><table><thead><tr><th scope="col">Norma</th><th scope="col">Qué regula o por qué se citó</th><th scope="col">Sesión</th></tr></thead><tbody>${LEYES.map(l=>fila(l[0],l[1],l[2])).join("")}</tbody></table></div></div>
${ARTS.map(g=>`<div class="grupo"><h2>${esc(g.s)}</h2><div class="tabla"><table><tbody>${g.r.map(r=>fila(r[0],r[1])).join("")}</tbody></table></div></div>`).join("")}
<div class="grupo"><h2>Claves para memorizar</h2><ul class="claves">${CLAVES.map(c=>`<li data-q="${norm(c)}">${esc(c)}</li>`).join("")}</ul></div>
<div class="row"><button type="button" class="btn primary" data-act="inicio">Volver al inicio</button></div></section>`;
}
function filtrar(q){
  const t=norm(q);let vis=0;
  $$(".teoria [data-q]",view).forEach(el=>{const ok=!t||el.dataset.q.includes(t);el.hidden=!ok;if(ok)vis++;});
  $$(".teoria .grupo",view).forEach(g=>{g.hidden=!!t&&!g.querySelector("[data-q]:not([hidden])");});
  const s=$("#sin-res");if(s)s.hidden=vis>0;
}

/* ===== Eventos ===== */
function limpiar(){
  if(timerId){clearInterval(timerId);timerId=null;}
  const d=$(".dlg-back");if(d)d.remove();
  view.classList.remove("solo-err");
}
const acciones={
  inicio:()=>{if(modo==="examen")guardarE();limpiar();renderInicio();irArriba();},
  rendir:b=>{const n=Number(b.dataset.n);if(!EXS[n-1])return;if(modo==="examen")guardarE();const d=cargarBorrador(n);limpiar();
    if(d){E=d;if(d.lim&&quedan(d)<=0){modo="examen";entregar(true);return;}renderExamen();irArriba();}else nuevoExamen(n);},
  descartar:b=>{store.del(kD(Number(b.dataset.n)));renderInicio();},
  practicar:b=>{const n=Number(b.dataset.n);if(!EXS[n-1]||EXS[n-1].fin)return;limpiar();iniciarPractica({n});},
  teoria:()=>{limpiar();renderTeoria();irArriba();},
  marcar:b=>marcar(b),
  siguiente:()=>siguiente(),
  terminar:()=>{limpiar();renderResumen();irArriba();},
  repasar:()=>{const ids=P.fallidas.slice();limpiar();iniciarPractica({ids});},
  otra:()=>{const cfg=P.cfg;limpiar();iniciarPractica(cfg);},
  ir:b=>irA(Number(b.dataset.n)),
  entregar:()=>pedirEntrega(),
  "practicar-fallos":()=>{const ids=E.resultado.res.filter(r=>!r.ok).map(r=>r.id);limpiar();iniciarPractica({ids});}
};
view.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||!view.contains(b))return;const f=acciones[b.dataset.act];if(f)f(b);});
view.addEventListener("change",e=>{const t=e.target;
  if(modo==="examen"&&t.matches("input[type=radio][data-q]")){E.resp[t.dataset.q]=Number(t.value);guardarE();actualizarCuenta();if(E.inst)bloquear(t.dataset.q);}
  else if(t.matches("input[data-lim]")){const n=Number(t.dataset.lim);store.set(kL(n),t.checked);const b=view.querySelector(`[data-tiempo="${n}"]`);if(b)b.textContent=t.checked?"6 min":"Sin límite";}
  else if(t.matches("input[data-inst]")){const n=Number(t.dataset.inst);store.set(kI(n),t.checked);const b=view.querySelector(`[data-resp="${n}"]`);if(b)b.textContent=t.checked?"Al instante":"Al entregar";}
  else if(t.id==="solo-err")view.classList.toggle("solo-err",t.checked);});
view.addEventListener("input",e=>{if(e.target.id==="filtro")filtrar(e.target.value);});
document.addEventListener("keydown",e=>{
  if(modo!=="practica"||!P||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target.closest&&e.target.closest("textarea,input,select"))return;
  const it=P.items[P.i];if(!it)return;
  if(!it.hecho){const m={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3}[e.key.toLowerCase()];if(m!==undefined){const b=view.querySelector(`.op[data-d="${m}"]`);if(b){e.preventDefault();marcar(b);}}}
  else if(e.key==="Enter"&&!(e.target.closest&&e.target.closest("button,a,summary"))){e.preventDefault();siguiente();}
});
window.addEventListener("resize",medirBarra);
window.addEventListener("pagehide",()=>{if(modo==="examen")guardarE();});
window.__quiz={MC,EXS};
renderInicio();
})();
</script>
</body>
</html>
